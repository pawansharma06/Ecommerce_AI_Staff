services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: shopai-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - shopai-network

  # Backend (Spring Boot 3.x / Java 21)
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: shopai-backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-shopai}
      - POSTGRES_USER=${POSTGRES_USER:-shopai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-shopai}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - APP_VERSION=${APP_VERSION:-1.0.0-SNAPSHOT}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - shopai-network

  # Frontend (React 18 + TypeScript + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: shopai-frontend
    ports:
      - "3000:80"
    networks:
      - shopai-network

  # PostgreSQL 16 + pgvector (Optimized for speed & large datasets)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shopai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopai}
      POSTGRES_USER: ${POSTGRES_USER:-shopai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopai} -d ${POSTGRES_DB:-shopai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shopai-network

  # Redis 7 (Cache, Queue, State)
  redis:
    image: redis:7-alpine
    container_name: shopai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shopai-network

volumes:
  postgres_data:
  redis_data:

networks:
  shopai-network:
    driver: bridge
